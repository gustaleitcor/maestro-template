# How Maestro runs the image this repo builds. Every key is optional.

# Where it may run: names from `maestro machines list`. Default: any machine.
# machines = ["dual"]

# One container per line. A line replaces the image's CMD, so main.py gets it
# as its arguments. No shell runs it: quotes group words, nothing else.
parameters = [
  "small",
  "large --time-limit 120",
]

# More lines, computed: one per string that genvrs() yields in this file.
# Its class Config can change outputs, cpus, memory, env, time and retries
# for each line.
generator = "genvrs.py"

# What each container may use: whole CPU cores, and memory in MB. There is
# always a limit. Default: 1 and 512. They also decide where and when a line
# runs: a machine starts it once that much is free there, so asking for less
# starts it sooner, and a line larger than every machine is refused.
cpus = 1
memory = 512

# The longest a line may run. Maestro stops it after that and ends it as
# error. main.py reads it from MAESTRO_TIME and ends its search 15 seconds
# before, so "large --time-limit 120" stops on its own. Default: the server's
# limit, a week unless the administrator set another.
time = "2m"

# How many times a line goes back to the queue when its machine is lost under
# it. A solve can start over from the beginning. 0 to 5. Default: 0.
retries = 2

# Variables of each container's environment, besides Maestro's own
# MAESTRO_CPUS, MAESTRO_MEMORY and the like, which main.py reads. Default:
# none.
env = { SEED = "42" }

# Copied out of each container when it ends. What it prints is always kept.
outputs = ["results/"]

# Where the outputs go: "per-line", a directory for each line, or "shared",
# one tree for the whole run. Shared puts every solution in one results/
# folder, `<run>/shared/results/` after `maestro runs get`. Default:
# "per-line".
outputs_layout = "shared"
