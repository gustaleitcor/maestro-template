# How Maestro runs the image this repo builds. Every key is optional.

# Where it may run: names from `maestro machines list`. Default: any machine.
# machines = ["dual"]

# One container per line. A line replaces the image's CMD, so main.py gets it
# as its arguments. No shell runs it: quotes group words, nothing else.
parameters = [
  "-t 10 out.txt",
  "-t 20 --label 'long run' out.txt",
]

# More lines, computed: one per string that genvrs() yields in this file.
# generator = "genvrs.py"

# Copied out of each container when it ends. What it prints is always kept.
outputs = ["out.txt"]
