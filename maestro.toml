# How Maestro runs the image this repo's Dockerfile builds.
# Read at build time and kept with that build, so `maestro run <build>`
# uses the file as it was at that commit.
#
# Every key is optional, and so is the file. Without it, a run is one
# container with the image's own CMD, on any machine, keeping only its logs.

# Machines the containers may run on, as `maestro machine list` names them.
# Default: any.
# machines = ["Q1", "Q2", "Q3"]

# One container per line, each line replacing the image's CMD. The program
# receives it as arguments, as in `podman run <image> -t 10 out.txt`.
# "" keeps the image's own CMD. Default: [""].
#
# Lines run once each, on whichever allowed machine has room first.
# A line is split like a shell would split it ("a b" is one argument), but
# no shell runs it: $VAR, pipes and redirections stay plain text.
parameters = [
  "-t 10 out.txt",
  "-t 20 out.txt",
  "-t 30 --label 'long run' out.txt",
]

# Files or directories copied out of each container when it ends, whether it
# succeeded or failed. Relative paths start at the image's WORKDIR.
# Each lands in the line's folder under its last name (out.txt, app/), so
# containers writing the same path don't clash.
#
# A path the container never created is noted as missing; the run doesn't
# fail for it. What a container prints is always kept, as <line>.log.
# Default: none.
outputs = [
  "out.txt",
  "/var/log/app/",
]
