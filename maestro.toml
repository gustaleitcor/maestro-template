# How Maestro runs the stress test. Every key is optional.

# Where it may run: names from `maestro machines list`. Default: any machine.
# machines = ["dual"]

# What the image is built from, a path from the root of the repo, which stays
# the build's context. Default: the Containerfile, or else the Dockerfile, at
# the root, which is what this repo has.
# dockerfile = "docker/Dockerfile"

# One container per line. A line replaces the image's CMD, so main.py gets it
# as its arguments. No shell runs it: quotes group words, nothing else.
# One of each mode, at maestro.toml's cpus and memory.
parameters = [
  "sleep 30",
  "burn 30",
  "hold 30 --fraction 0.5",
  "mix 30",
]

# More lines, computed: 996 of many sizes, which makes 1000. Its class Config
# changes outputs, cpus, memory and env for each line.
generator = "genvrs.py"

# What each container may use: whole CPU cores, and memory in MB. There is
# always a limit. Default: 1 and 512. They also decide where and when a line
# runs: a machine starts it once that much is free there.
cpus = 1
memory = 512

# The longest a line may run. Maestro stops it after that, keeps its logs and
# outputs, and ends it as error. Default: the server's limit, a week unless
# the administrator set another. No line here needs more than 4 minutes.
time = "10m"

# How many times a line goes back to the queue when its machine is lost under
# it: restarted, removed, or its container gone. 0 to 5. Default: 0, which
# ends such a line as error. Every line here can start over from scratch.
retries = 2

# Variables of each container's environment, besides Maestro's own
# MAESTRO_CPUS, MAESTRO_MEMORY and the like, which main.py reads. Default:
# none. The generator's lines set their own instead.
env = { STRESS_LINE = "parameters", STRESS_SHAPE = "default" }

# Copied out of each container when it ends. What it prints is always kept.
# Lines run with --samples also keep samples.csv, which genvrs.py adds.
outputs = ["report.json"]
